<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @keyframes tern-spin { to { transform: rotate(360deg) } }
    @keyframes tern-fade-in { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
  </style>
</helmet>
<div style="display:flex; gap:12px; padding:14px 16px; borderBottom:1px solid oklch(0.28 0.006 60); cursor:default; position:relative" style-hover="background:oklch(0.235 0.006 60)">
  <div style="flexShrink:0; width:26px; height:26px; borderRadius:7px; display:flex; alignItems:center; justifyContent:center; marginTop:2px; background:{{ kindBg }}; color:{{ kindFg }}; fontSize:10px; fontWeight:600">
    <sc-if value="{{ isProject }}" hint-placeholder-val="{{ false }}">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="{{ kindFg }}" stroke-width="1.2"><rect x="1.2" y="3" width="11.6" height="9" rx="1.5"></rect><rect x="4.2" y="1.6" width="5.6" height="2.4" rx="1"></rect></svg>
    </sc-if>
    <sc-if value="{{ isTask }}" hint-placeholder-val="{{ false }}">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="{{ kindFg }}" stroke-width="1.2"><circle cx="7" cy="7" r="5.6"></circle><path d="M7 4.2V7l2 1.6"></path></svg>
    </sc-if>
    <sc-if value="{{ isSkill }}" hint-placeholder-val="{{ true }}">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="{{ kindFg }}" stroke-width="1.2" stroke-linecap="round"><circle cx="4.1" cy="4.1" r="2.5"></circle><path d="M5.9 5.9l5.4 5.4M2.4 2.4l1.7 1.7"></path></svg>
    </sc-if>
    <sc-if value="{{ isPrompt }}" hint-placeholder-val="{{ false }}">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="{{ kindFg }}" stroke-width="1.2"><rect x="2.2" y="1.6" width="9.6" height="10.8" rx="1.4"></rect><path d="M4.6 5h4.8M4.6 7.4h4.8M4.6 9.8h2.8"></path></svg>
    </sc-if>
  </div>
  <div style="flex:1; minWidth:0; display:flex; flexDirection:column; gap:6px">
    <div style="display:flex; alignItems:baseline; gap:8px">
      <div style="fontSize:13.5px; lineHeight:1.35; color:oklch(0.93 0.004 60); fontWeight:500; textWrap:pretty">{{ title }}</div>
    </div>
    <div style="fontSize:13px; lineHeight:1.5; color:oklch(0.78 0.005 60); textWrap:pretty">{{ detail }}</div>
    <div style="display:flex; alignItems:center; gap:10px; marginTop:4px" data-dc-tpl="6">
      <sc-if value="{{ showPrimary }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ onStart }}" style="border:none; borderRadius:6px; padding:5px 11px; fontSize:12px; fontWeight:500; fontFamily:inherit; cursor:pointer; background:oklch(0.75 0.11 175); color:oklch(0.2 0.02 175)" style-hover="background:oklch(0.8 0.11 175)">{{ action }}</button>
      </sc-if>
      <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ onView }}" onMouseEnter="{{ onHoverStart }}" onMouseLeave="{{ onHoverEnd }}" onFocus="{{ onHoverStart }}" onBlur="{{ onHoverEnd }}" style="border:none; borderRadius:6px; padding:5px 13px; fontSize:12px; fontWeight:500; fontFamily:inherit; cursor:pointer; background:oklch(0.62 0.15 250); color:oklch(0.98 0.02 250); animation:{{ fadeIn }}" style-hover="background:oklch(0.7 0.15 250)">View</button>
      </sc-if>
      <sc-if value="{{ showLearn }}" hint-placeholder-val="{{ true }}">
        <a href="{{ learnUrl }}" target="_blank" rel="noopener" style="border:1px solid oklch(0.36 0.006 60); borderRadius:6px; padding:4px 11px; fontSize:12px; fontWeight:500; fontFamily:inherit; cursor:pointer; textDecoration:none; color:oklch(0.86 0.004 60); animation:{{ fadeIn }}" style-hover="background:oklch(0.3 0.005 60); color:oklch(0.97 0.004 60)">Learn more</a>
      </sc-if>
      <sc-if value="{{ showDismiss }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ onDismiss }}" style="border:none; background:none; padding:5px 4px; fontSize:13px; fontFamily:inherit; cursor:pointer; color:oklch(0.82 0.004 60); animation:{{ fadeIn }}" style-hover="color:oklch(0.97 0.004 60)">Dismiss</button>
      </sc-if>
      <div style="marginLeft:auto; display:flex; alignItems:center; gap:2px">
        <button onClick="{{ onUp }}" title="This was useful" style="width:24px; height:24px; borderRadius:6px; border:none; background:{{ upBg }}; cursor:pointer; display:flex; alignItems:center; justifyContent:center; color:{{ upFg }}" style-hover="background:oklch(0.3 0.005 60)">
          <svg width="13" height="13" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M5.4 13V6.6l2.6-4.2a1.15 1.15 0 0 1 2.05.95L9.3 6.2h2.5a1.3 1.3 0 0 1 1.28 1.55l-.62 3.6A1.7 1.7 0 0 1 10.8 13z"></path><rect x="1.9" y="6.6" width="3.5" height="6.4" rx="0.9"></rect></svg>
        </button>
        <button onClick="{{ onDown }}" title="Not useful" style="width:24px; height:24px; borderRadius:6px; border:none; background:{{ downBg }}; cursor:pointer; display:flex; alignItems:center; justifyContent:center; color:{{ downFg }}" style-hover="background:oklch(0.3 0.005 60)">
          <svg width="13" height="13" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" style="transform: rotate(180deg)"><path d="M5.4 13V6.6l2.6-4.2a1.15 1.15 0 0 1 2.05.95L9.3 6.2h2.5a1.3 1.3 0 0 1 1.28 1.55l-.62 3.6A1.7 1.7 0 0 1 10.8 13z"></path><rect x="1.9" y="6.6" width="3.5" height="6.4" rx="0.9"></rect></svg>
        </button>
      </div>
    </div>

    <sc-if value="{{ fbOpen }}" hint-placeholder-val="{{ false }}">
      <div style="marginTop:6px; border:1px solid oklch(0.33 0.006 60); background:oklch(0.205 0.005 60); borderRadius:9px; padding:10px 11px; display:flex; flexDirection:column; gap:8px; animation: tern-fade-in 220ms ease both">
        <div style="fontSize:12px; color:oklch(0.85 0.004 60)">{{ fbTitle }}</div>
        <textarea value="{{ fbNote }}" onChange="{{ onFbNote }}" rows="2" placeholder="{{ fbPlaceholder }}" style="border:1px solid oklch(0.3 0.006 60); borderRadius:7px; background:oklch(0.225 0.005 60); padding:7px 8px; resize:none; outline:none; fontFamily:inherit; fontSize:12px; lineHeight:1.5; color:oklch(0.92 0.004 60)" style-focus="borderColor:oklch(0.5 0.06 175)"></textarea>
        <div style="display:flex; alignItems:center; gap:8px">
          <button onClick="{{ sendFb }}" style="border:none; borderRadius:6px; padding:5px 11px; fontSize:12px; fontWeight:500; fontFamily:inherit; cursor:pointer; background:oklch(0.75 0.11 175); color:oklch(0.2 0.02 175)" style-hover="background:oklch(0.82 0.11 175)">Send feedback</button>
          <button onClick="{{ cancelFb }}" style="border:none; background:none; padding:5px 2px; cursor:pointer; fontFamily:inherit; fontSize:12px; color:oklch(0.68 0.006 60)" style-hover="color:oklch(0.95 0.004 60)">Cancel</button>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ fbSent }}" hint-placeholder-val="{{ false }}">
      <div style="marginTop:4px; fontSize:11.5px; color:oklch(0.66 0.03 175); animation: tern-fade-in 220ms ease both">Thanks — feedback noted.</div>
    </sc-if>
    <div style="overflow:hidden; transition: max-height 320ms cubic-bezier(0.22, 0.61, 0.24, 1), opacity 240ms ease; maxHeight:{{ progressMax }}; opacity:{{ progressOpacity }}">
      <div style="display:flex; alignItems:center; gap:9px; marginTop:8px; padding:9px 11px; borderRadius:8px; background:oklch(0.26 0.02 250); border:1px solid oklch(0.34 0.04 250)">
        <sc-if value="{{ isRunning }}" hint-placeholder-val="{{ false }}">
          <span style="width:12px; height:12px; borderRadius:50%; flexShrink:0; border:1.6px solid oklch(0.45 0.05 250); borderTopColor:oklch(0.85 0.12 250); animation: tern-spin 0.75s linear infinite"></span>
        </sc-if>
        <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
          <span style="width:12px; height:12px; borderRadius:50%; flexShrink:0; background:oklch(0.75 0.11 175); color:oklch(0.2 0.02 175); fontSize:9px; display:flex; alignItems:center; justifyContent:center">✓</span>
        </sc-if>
        <span style="fontSize:12px; color:oklch(0.88 0.02 250)">{{ statusText }}</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:404,&quot;height&quot;:170},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;skill&quot;,&quot;task&quot;,&quot;project&quot;,&quot;prompt&quot;],&quot;default&quot;:&quot;skill&quot;,&quot;tsType&quot;:&quot;'skill'|'task'|'project'|'prompt'&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;You've requested the same digest format in four chats&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;detail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Saving it as a Skill means you stop restating the format every Monday.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;action&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Create skill&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4 chats&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onView&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onComplete&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onDismiss&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onHoverStart&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onHoverEnd&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const PROJECTS_DOC = "https://support.claude.com/en/articles/9517075-what-are-projects";
const KINDS = {
  skill:   { bg: "oklch(0.32 0.05 175)", fg: "oklch(0.86 0.09 175)", doc: "https://support.claude.com/en/articles/12512176-what-are-skills" },
  task:    { bg: "oklch(0.33 0.05 75)",  fg: "oklch(0.88 0.1 75)", doc: "https://code.claude.com/docs/en/scheduled-tasks" },
  project: { bg: "oklch(0.32 0.05 280)", fg: "oklch(0.86 0.08 280)", doc: PROJECTS_DOC },
  prompt:  { bg: "oklch(0.3 0.01 60)",   fg: "oklch(0.82 0.006 60)", doc: PROJECTS_DOC }
};

class Component extends DCLogic {
  state = { vote: null, fbOpen: false, fbNote: "", fbSent: false };

  vote(dir) {
    if (this.state.fbOpen && this.state.vote === dir) return this.setState({ fbOpen: false });
    this.setState({ vote: dir, fbOpen: true, fbSent: false, fbNote: "" });
  }

  renderVals() {
    const k = KINDS[this.props.kind] || KINDS.prompt;
    const p = this.props.phase || "idle";
    return {
      isSkill: this.props.kind === "skill",
      isTask: this.props.kind === "task",
      isProject: this.props.kind === "project",
      isPrompt: this.props.kind === "prompt",
      kindBg: k.bg,
      kindFg: k.fg,
      title: this.props.title ?? "Insight",
      detail: this.props.detail ?? "",
      action: this.props.action ?? "Set up",
      meta: this.props.meta ?? "",
      onStart: this.props.onStart || (() => {}),
      showPrimary: p === "idle",
      showDismiss: p !== "running",
      showLearn: p !== "running",
      learnUrl: k.doc,
      fadeIn: p === "done" ? "tern-fade-in 320ms ease both" : "none",
      isRunning: p === "running",
      isDone: p === "done",
      statusText: this.props.statusText ?? "",
      progressMax: p === "idle" ? "0px" : "60px",
      progressOpacity: p === "idle" ? 0 : 1,
      onView: this.props.onView || (() => {}),
      onDismiss: this.props.onDismiss || (() => {}),
      onUp: () => this.vote("up"),
      onDown: () => this.vote("down"),
      upBg: this.state.vote === "up" ? "oklch(0.3 0.04 175)" : "transparent",
      upFg: this.state.vote === "up" ? "oklch(0.86 0.09 175)" : "oklch(0.66 0.006 60)",
      downBg: this.state.vote === "down" ? "oklch(0.3 0.04 30)" : "transparent",
      downFg: this.state.vote === "down" ? "oklch(0.84 0.09 30)" : "oklch(0.66 0.006 60)",
      fbOpen: this.state.fbOpen,
      fbSent: this.state.fbSent,
      fbTitle: this.state.vote === "down" ? "What was off about this insight?" : "What made this insight useful?",
      fbPlaceholder: this.state.vote === "down" ? "Wrong pattern, bad timing, already handled…" : "Saved me a step, caught something I'd missed…",
      fbNote: this.state.fbNote,
      onFbNote: e => this.setState({ fbNote: e.target.value }),
      sendFb: () => this.setState({ fbOpen: false, fbSent: true }),
      cancelFb: () => this.setState({ fbOpen: false, vote: null }),
      onHoverStart: this.props.onHoverStart || (() => {}),
      onHoverEnd: this.props.onHoverEnd || (() => {})
    };
  }
}
</script>
</body>
</html>
